name: update-els-data

on:
  schedule:
    # 07:35 KST Mon-Fri (after US/EU close, before market open)
    - cron: "35 22 * * 0-4"
  workflow_dispatch:
    inputs:
      full_scan:
        description: "Wide ISIN scan (1 = yes)"
        required: false
        default: "0"
      max_probes:
        description: "Max detail-page probes this run"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: els-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Collect
        env:
          FULL_SCAN: ${{ github.event.inputs.full_scan || '0' }}
          MAX_PROBES: ${{ github.event.inputs.max_probes }}
          KSD_API_KEY: ${{ secrets.KSD_API_KEY }}
          KSD_ENDPOINT: ${{ secrets.KSD_ENDPOINT }}
        run: |
          if [ -z "$MAX_PROBES" ]; then unset MAX_PROBES; fi
          python scripts/collect.py

      - name: Commit data
        run: |
          git config user.name "els-bot"
          git config user.email "els-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "push retry $i"; sleep 10
          done
          exit 1
